<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111d">
<link rel="manifest" href="manifest.webmanifest">
<title>MiMap 导航</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111d;color:#f5f8fc;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
main{max-width:520px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}.tag{font-size:11px;color:#50d9a5;border:1px solid #286b57;border-radius:20px;padding:6px 10px}
.screen{background:#02070c;border:1px solid #25364a;border-radius:30px;padding:22px 18px;min-height:440px;display:flex;flex-direction:column;box-shadow:0 20px 50px #0008}
.metrics{display:flex;justify-content:space-between}.metric small{display:block;color:#91a2b8;font-size:12px}.metric strong{font-size:20px}.right{text-align:right}
.arrow{flex:1;display:grid;place-items:center;color:#4bd9a4;font-size:150px;font-weight:800;text-shadow:0 0 25px #4bd9a455}
.eta{text-align:center}.eta small{display:block;color:#91a2b8;font-size:12px}.eta strong{font-size:30px}.instruction{text-align:center;color:#b7c6d8;margin-top:7px}
.panel{background:#142235;border:1px solid #293c54;border-radius:18px;padding:16px}.panel h2{font-size:16px;margin:0 0 12px}
label{display:block;color:#aebed0;font-size:12px;margin:10px 0 5px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #40536c;background:#091321;color:white;font:inherit}
button{border:0;border-radius:11px;padding:13px;font-weight:700;font-size:15px;background:#4bd9a4;color:#052116;width:100%;margin-top:12px}
.secondary{background:#2b4059;color:white}.hint{font-size:12px;color:#93a5ba;line-height:1.55}
#status{font-size:12px;color:#4bd9a4;margin-top:10px;line-height:1.5}
</style>
</head>
<body><main>
<header><h1>MiMap</h1><span class="tag">高德路线测试版</span></header>
<section class="screen">
 <div class="metrics">
  <div class="metric"><small>剩余路程</small><strong id="distance">等待规划</strong></div>
  <div class="metric right"><small>当前速度</small><strong id="speed">-- km/h</strong></div>
 </div>
 <div class="arrow" id="arrow">↑</div>
 <div class="eta"><small>预计到达</small><strong id="eta">--:--</strong><div class="instruction" id="instruction">输入目的地开始规划</div></div>
</section>
<section class="panel">
 <h2>高德路线规划</h2>
 <label for="destination">目的地地址</label>
 <input id="destination" type="text" placeholder="例如：台北车站、台北市政府">
 <button id="route">获取当前位置并规划路线</button>
 <button class="secondary" id="locate">读取手机当前位置</button>
 <div id="status">状态：已连接高德地址解析和驾车路线接口。</div>
</section>
<p class="hint">提示：请允许浏览器使用精确定位。当前版本可获取 GPS 位置、实时速度并根据位置更新转向步骤；手环同步功能仍在后续开发中。iPhone 网页不能直接连接小米手环 9 Pro。</p>
</main>
<script>
const API = "https://mimap-api.v758gg67yf.workers.dev";
const $ = id => document.getElementById(id);
let currentPosition = null;
let currentSpeed = 0;
let routeSteps = [];
let activeStepIndex = 0;

let speedWatchId = null;
function startLiveSpeed() {
  if (!navigator.geolocation || speedWatchId !== null) return;
  speedWatchId = navigator.geolocation.watchPosition(
    position => {
      currentPosition = position;
      updateSpeed(position);
      updateRouteProgress(position);
    },
    error => {
      console.warn("GPS 实时速度读取失败：", error.message);
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
  );
}

function showStatus(message, error = false) {
  $("status").textContent = message;
  $("status").style.color = error ? "#ff9b9b" : "#4bd9a4";
}

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("当前浏览器不支持定位"));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      position => resolve(position),
      error => reject(new Error("定位失败：" + error.message)),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

function directionFromStep(step) {
  const s = (step.instruction || "") + " " + (step.action || "");
  if (/左转|向左|左前方|左后方/.test(s)) return "←";
  if (/右转|向右|右前方|右后方/.test(s)) return "→";
  if (/掉头|调头/.test(s)) return "↶";
  if (/环岛/.test(s)) return "↻";
  return "↑";
}

function updateSpeed(position) {
  const speed = position.coords.speed;
  if (speed !== null && Number.isFinite(speed) && speed >= 0) {
    currentSpeed = speed * 3.6;
  }
  $("speed").textContent = currentSpeed.toFixed(0) + " km/h";
}

function metersBetween(a, b) {
  const rad = value => value * Math.PI / 180;
  const dLat = rad(b.lat - a.lat);
  const dLon = rad(b.lon - a.lon);
  const lat1 = rad(a.lat), lat2 = rad(b.lat);
  const h = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function stepPoints(step) {
  return String(step.polyline || "").split(";").map(pair => {
    const parts = pair.split(",");
    return { lon: Number(parts[0]), lat: Number(parts[1]) };
  }).filter(point => Number.isFinite(point.lon) && Number.isFinite(point.lat));
}

function updateRouteProgress(position) {
  if (!routeSteps.length) return;
  const here = { lon: position.coords.longitude, lat: position.coords.latitude };
  let bestIndex = activeStepIndex;
  let bestDistance = Infinity;
  const last = Math.min(routeSteps.length - 1, activeStepIndex + 4);

  for (let i = activeStepIndex; i <= last; i++) {
    const points = stepPoints(routeSteps[i]);
    for (const point of points) {
      const distance = metersBetween(here, point);
      if (distance < bestDistance) {
        bestDistance = distance;
        bestIndex = i;
      }
    }
  }

  if (bestDistance < 80 && bestIndex > activeStepIndex) {
    activeStepIndex = bestIndex;
  }
  renderActiveStep();
}

function distanceToStepEnd(step, position) {
  const points = stepPoints(step);
  if (points.length < 2 || !position) return Number(step.distance) || 0;
  const here = {
    lon: position.coords.longitude,
    lat: position.coords.latitude
  };
  let nearestIndex = 0;
  let nearestDistance = Infinity;
  points.forEach((point, index) => {
    const distance = metersBetween(here, point);
    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearestIndex = index;
    }
  });
  let remaining = 0;
  for (let i = nearestIndex; i < points.length - 1; i++) {
    remaining += metersBetween(points[i], points[i + 1]);
  }
  return remaining;
}

function renderActiveStep() {
  if (!routeSteps.length) return;
  const step = routeSteps[activeStepIndex] || {};
  const remainingMeters = routeSteps.slice(activeStepIndex)
    .reduce((sum, item) => sum + (Number(item.distance) || 0), 0);
  const remainingSeconds = routeSteps.slice(activeStepIndex)
    .reduce((sum, item) => sum + (Number(item.duration) || 0), 0);
  const turnDistance = distanceToStepEnd(step, currentPosition);
  const turnDistanceText = turnDistance >= 1000
    ? (turnDistance / 1000).toFixed(1) + " 公里"
    : Math.max(0, Math.round(turnDistance / 10) * 10) + " 米";

  $("distance").textContent = remainingMeters >= 1000
    ? (remainingMeters / 1000).toFixed(1) + " km"
    : Math.round(remainingMeters) + " m";
  $("arrow").textContent = directionFromStep(step);
  $("instruction").textContent = "前方约 " + turnDistanceText + " · " +
    (step.instruction || "沿路线行驶");
  const eta = new Date(Date.now() + remainingSeconds * 1000);
  $("eta").textContent = eta.toLocaleTimeString("zh-CN", {
    hour: "2-digit", minute: "2-digit"
  });
}

async function planRoute() {
  const address = $("destination").value.trim();
  if (!address) {
    showStatus("请先输入目的地地址。", true);
    $("destination").focus();
    return;
  }

  $("route").disabled = true;
  $("route").textContent = "正在规划路线…";
  showStatus("正在获取 GPS 位置…");

  try {
    const position = await getPosition();
    currentPosition = position;
    updateSpeed(position);

    showStatus("正在查询目的地坐标…");
    const geoUrl = API + "/api/geocode?address=" + encodeURIComponent(address);
    const geoResponse = await fetch(geoUrl);
    if (!geoResponse.ok) throw new Error("地址解析接口 HTTP " + geoResponse.status);
    const geo = await geoResponse.json();
    if (geo.status !== "1" || !geo.geocodes || !geo.geocodes.length) {
      throw new Error("高德没有找到这个地址，请补充城市或区县。");
    }

    const destination = geo.geocodes[0].location;
    const origin = position.coords.longitude + "," + position.coords.latitude;

    showStatus("目的地已找到，正在计算驾车路线…");
    const routeUrl = API + "/api/driving?origin=" +
      encodeURIComponent(origin) + "&destination=" +
      encodeURIComponent(destination);
    const routeResponse = await fetch(routeUrl);
    if (!routeResponse.ok) throw new Error("路线接口 HTTP " + routeResponse.status);
    const data = await routeResponse.json();

    if (data.status !== "1" || !data.route || !data.route.paths || !data.route.paths.length) {
      throw new Error("高德路线规划失败：" + (data.info || data.infocode || "未知错误"));
    }

    const path = data.route.paths[0];
    const meters = Number(path.distance);
    const seconds = Number(path.duration);
    routeSteps = path.steps || [];
    activeStepIndex = 0;
    renderActiveStep();

    showStatus("路线规划成功：" + (geo.geocodes[0].formatted_address || address) +
      "。全程约 " + Math.round(meters) + " 米，预计 " +
      Math.ceil(seconds / 60) + " 分钟。");
  } catch (error) {
    showStatus(error.message || "发生未知错误", true);
  } finally {
    $("route").disabled = false;
    $("route").textContent = "获取当前位置并规划路线";
  }
}

$("route").addEventListener("click", planRoute);
startLiveSpeed();
$("locate").addEventListener("click", async () => {
  showStatus("正在读取手机 GPS…");
  try {
    const position = await getPosition();
    currentPosition = position;
    updateSpeed(position);
    showStatus("定位成功：" + position.coords.latitude.toFixed(6) +
      ", " + position.coords.longitude.toFixed(6));
  } catch (error) {
    showStatus(error.message, true);
  }
});

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script></body></html>
